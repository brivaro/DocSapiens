# docker compose up --build

x-ollama: &service-ollama
  image: ollama/ollama:latest
  restart: unless-stopped
  ports:
    - 11434:11434
  volumes:
    - ollama_storage:/root/.ollama

x-init-ollama: &init-ollama
  image: ollama/ollama:latest
  entrypoint: /bin/sh
  environment:
    - OLLAMA_HOST=ollama:11434
  volumes:
    - ollama_storage:/root/.ollama
  command:
    - "-c"
    - "sleep 3; ollama pull llama3.2"

services:
  backend:
    build: 
      context: ./backend
    container_name: backend
    env_file:
      - .env
    environment:
      - PYTHONPATH=/ # Python ahora se parará en la raíz (/), encuentra la carpeta backend y hace el import backend.main
      - GOOGLE_APPLICATION_CREDENTIALS=/backend/gcp-service-account.json
      - GCP_PROJECT_ID=${GCP_PROJECT_ID}
      - GCP_REGION=${GCP_REGION}
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - qdrant
    volumes:
      - ./backend:/backend
      - ./gcp-service-account.json:/backend/gcp-service-account.json
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000

  postgres:
    image: postgres:15
    container_name: postgres-rag
    restart: always
    environment:
      POSTGRES_USER: docsa_user
      POSTGRES_PASSWORD: docsa_pass
      POSTGRES_DB: docsa_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant-rag
    restart: always
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  frontend:
    build:
      context: ./frontend
    container_name: frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/frontend
    depends_on:
      - backend

  # Ollama CPU-only
  ollama-cpu:
    <<: *service-ollama
    container_name: ollama-cpu-rag
    profiles: ["cpu"]

  # Ollama NVIDIA GPU
  ollama-gpu:
    <<: *service-ollama
    container_name: ollama-gpu-rag
    profiles: ["gpu-nvidia"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # Ollama AMD ROCm GPU
  ollama-gpu-amd:
    <<: *service-ollama
    image: ollama/ollama:rocm
    container_name: ollama-gpu-amd-rag
    profiles: ["gpu-amd"]
    devices:
      - "/dev/kfd"
      - "/dev/dri"

  # Pull llama3.2 for each profile
  ollama-pull-llama-cpu:
    <<: *init-ollama
    container_name: ollama-pull-cpu-rag
    profiles: ["cpu"]
    depends_on:
      - ollama-cpu

  ollama-pull-llama-gpu:
    <<: *init-ollama
    container_name: ollama-pull-gpu-rag
    profiles: ["gpu-nvidia"]
    depends_on:
      - ollama-gpu

  ollama-pull-llama-gpu-amd:
    <<: *init-ollama
    image: ollama/ollama:rocm
    container_name: ollama-pull-gpu-amd-rag
    profiles: ["gpu-amd"]
    depends_on:
      - ollama-gpu-amd

volumes:
  pgdata:
  qdrant_data: 
  ollama_storage: