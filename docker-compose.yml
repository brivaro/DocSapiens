services:
  backend:
    build: 
      context: ./backend
    container_name: backend
    env_file:
      - .env
    environment:
      - PYTHONPATH=/ # Python ahora se parará en la raíz (/), encuentra la carpeta backend y hace el import backend.main
      - GOOGLE_APPLICATION_CREDENTIALS=/backend/gcp-service-account.json
      - GCP_PROJECT_ID=${GCP_PROJECT_ID}
      - GCP_REGION=${GCP_REGION}
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - qdrant
    volumes:
      - ./backend:/backend
      - ./gcp-service-account.json:/backend/gcp-service-account.json
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000

  postgres:
    image: postgres:16-alpine
    container_name: postgres-rag
    restart: always
    environment:
      POSTGRES_USER: docsa_user
      POSTGRES_PASSWORD: docsa_pass
      POSTGRES_DB: docsa_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant-rag
    restart: always
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  frontend:
    build:
      context: ./frontend
    container_name: frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/frontend
    depends_on:
      - backend

volumes:
  pgdata:
  qdrant_data: 