server {
    # Escucha en el puerto 80, el puerto estándar HTTP
    listen 80;

    # Directorio raíz donde están los archivos de tu app
    root /usr/share/nginx/html;

    # Sirve el index.html por defecto para directorios
    index index.html index.htm;

    # ========================================
    # PROXY PARA EL BACKEND (API)
    # ========================================
    
    # Proxy para todas las rutas de la API
    location /api/ {
        proxy_pass http://docsapiens_backend:8082/api/; 
        
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ========================================
    # ARCHIVOS ESTÁTICOS (SPA)
    # ========================================
    
    # Configuración de enrutamiento principal para una SPA
    # Desactivar caché para index.html para asegurar que siempre carga los JS nuevos
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Archivos estáticos con hash (CSS, JS, imágenes)
    # Vite genera nombres únicos (hash) para estos archivos, así que es seguro cachearlos 'forever'
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public";
    }

    # ========================================
    # CONFIGURACIÓN ADICIONAL
    # ========================================
    
    # Aumenta el tamaño máximo de body para subidas de archivos
    client_max_body_size 100M;
    
    # Logs
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;
}